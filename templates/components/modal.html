<div id="{{ id }}" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('{{ id }}')"></div>
  <div class="fixed inset-0 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h3 class="text-lg font-bold text-gray-900">{{ title }}</h3>
        <button onclick="closeModal('{{ id }}')" class="text-gray-400 hover:text-gray-600">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="px-6 py-4">
        {% if form_action %}<form method="post" action="{{ form_action }}" class="{{ form_class|default:'space-y-4' }}">{% csrf_token %}{% endif %}
        {{ content|safe }}
        {% if form_action %}</form>{% endif %}
      </div>
    </div>
  </div>
</div>
<script>
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
</script>
