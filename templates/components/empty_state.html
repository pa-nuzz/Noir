{% load static %}
<div class="flex flex-col items-center justify-center px-6 py-12 text-center border border-gray-200 rounded-lg {{ class }}">
  {% if illustration %}
    <img src="{% static illustration %}" alt="" class="w-32 h-32 mb-4 opacity-60" loading="lazy">
  {% else %}
    <div class="mb-4 w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center">
      <svg class="w-6 h-6 text-gray-400" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="{{ icon|default:'M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-2.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4' }}"/>
      </svg>
    </div>
  {% endif %}
  <h3 class="text-[15px] font-bold text-slate-800 mb-1">{{ title|default:'Nothing here yet' }}</h3>
  <p class="text-sm text-slate-500 max-w-[260px] leading-relaxed">{{ description|default:'Get started by creating your first item.' }}</p>
  {% if cta_url and cta_label %}
    <a href="{{ cta_url }}" class="btn-action btn-action-primary mt-4">{{ cta_label }}</a>
  {% endif %}
</div>
