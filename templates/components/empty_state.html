{% load static %}
<div class="empty-state {% if compact %}compact{% endif %} {{ class }}">
  {% if illustration %}
    <div class="empty-icon">
      <img src="{% static illustration %}" alt="" class="w-8 h-8 object-contain opacity-75" loading="lazy">
    </div>
  {% else %}
    <div class="empty-icon">
      <svg class="w-6 h-6" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="{{ icon|default:'M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-2.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4' }}"/>
      </svg>
    </div>
  {% endif %}
  <h3 class="empty-title">{{ title|default:'Nothing here yet' }}</h3>
  <p class="empty-desc">{{ description|default:'Get started by creating your first item.' }}</p>
  {% if cta_url and cta_label %}
    <a href="{{ cta_url }}" class="btn-action btn-action-primary mt-4">{{ cta_label }}</a>
  {% endif %}
</div>
