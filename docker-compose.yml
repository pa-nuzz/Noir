version: "3.9"

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_plans &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_BACKEND: redis
      REDIS_CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker_critical:
    build: .
    command: celery -A core worker -Q critical --concurrency=2 --loglevel=info
    volumes:
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_BACKEND: redis
      REDIS_CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker_default:
    build: .
    command: celery -A core worker -Q default --concurrency=2 --loglevel=info
    volumes:
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_BACKEND: redis
      REDIS_CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker_low:
    build: .
    command: celery -A core worker -Q low --concurrency=1 --loglevel=info
    volumes:
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_BACKEND: redis
      REDIS_CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A core beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DEBUG: "False"
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_BACKEND: redis
      REDIS_CACHE_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
