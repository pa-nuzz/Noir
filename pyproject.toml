[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps", "core"]
norecursedirs = ["venv", ".env", "migrations", "staticfiles"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*migrations/*" = ["E501", "I"]
"*tests*" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/migrations/*", "*/tests/*", "venv/*"]
