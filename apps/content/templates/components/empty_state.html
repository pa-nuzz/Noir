<div class="px-6 py-12 text-center">
  {% if icon %}<div class="flex justify-center mb-3">{{ icon }}</div>{% endif %}
  <p class="text-sm{% if description %} font-semibold text-slate-900{% else %} text-gray-500{% endif %}">{{ title }}</p>
  {% if description %}<p class="text-sm text-gray-500 mt-1">{{ description }}</p>{% endif %}
  {% if cta_url and cta_label %}<a href="{{ cta_url }}" class="inline-flex mt-3 items-center gap-2 px-4 py-2 rounded-xl bg-primary text-white text-sm font-semibold">{{ cta_label }}</a>{% endif %}
</div>
