<div id="{{ id }}" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('{{ id }}')"></div>
  <div class="fixed inset-0 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[80vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">{{ title }}</h3>
        <button type="button" onclick="closeModal('{{ id }}')" class="text-gray-400 hover:text-gray-600">&times;</button>
      </div>
      <div class="px-6 py-4">
        {% if form_action %}<form method="post" action="{{ form_action }}" class="{{ form_class|default:'space-y-4' }}">{% csrf_token %}{% endif %}
        {{ content|safe }}
        {% if form_action %}</form>{% endif %}
      </div>
    </div>
  </div>
</div>
