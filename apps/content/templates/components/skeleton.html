{% with c=count|default:1 %}{% for i in ""|center:c %}{% if type == 'card' %}
<div class="animate-pulse bg-white rounded-2xl p-5 space-y-3">
  <div class="h-3 bg-slate-200 rounded w-1/3"></div>
  <div class="h-6 bg-slate-200 rounded w-1/2"></div>
</div>{% elif type == 'table_row' %}
<div class="animate-pulse flex items-center gap-4 px-6 py-4">
  <div class="w-8 h-8 rounded-lg bg-slate-200"></div>
  <div class="flex-1 space-y-2">
    <div class="h-3 bg-slate-200 rounded w-3/4"></div>
    <div class="h-2 bg-slate-200 rounded w-1/2"></div>
  </div>
  <div class="w-16 h-5 bg-slate-200 rounded-full"></div>
</div>{% elif type == 'text_block' %}
<div class="animate-pulse space-y-2">
  <div class="h-3 bg-slate-200 rounded w-full"></div>
  <div class="h-3 bg-slate-200 rounded w-5/6"></div>
  <div class="h-3 bg-slate-200 rounded w-4/6"></div>
</div>{% elif type == 'chip' %}
<div class="animate-pulse inline-block px-3 py-1.5 rounded-lg bg-slate-200 w-20 h-6"></div>{% endif %}{% endfor %}{% endwith %}
