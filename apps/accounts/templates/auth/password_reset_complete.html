{% extends "base.html" %}
{% load static %}
{% block title %}Password Reset Complete — Intelligent Digital Automation (IDA){% endblock %}
{% block extra_head %}
<style>
  @keyframes logoPop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="auth-card !max-w-[480px]">
    <div class="text-center mb-10">
      <div class="flex justify-center mb-8" style="animation: logoPop .5s ease-out both;">
        <img src="{% static 'images/logo-mark.svg' %}?v={{ STATIC_VERSION }}" alt="Intelligent Digital Automation (IDA) Logo" class="w-12 h-12" />
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Password set!</h1>
      <p class="text-sm text-slate-500 mt-1">Your password has been set. You may go ahead and log in now.</p>
    </div>

    <a href="{% url 'accounts:login' %}" class="btn-primary w-full justify-center py-3.5 text-lg shadow-lg shadow-indigo-500/25">
      Log in
    </a>
  </div>
</div>
{% endblock %}
