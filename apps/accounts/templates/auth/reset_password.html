<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<style>body{background:#17211d}html{background:#17211d}.auth-card{overflow:hidden}.auth-wrap{opacity:0;animation:authFadeIn .25s ease forwards}@keyframes authFadeIn{to{opacity:1}}nav{background:rgba(255,255,255,0.95);border-bottom:1px solid #d8e0d5}nav a{color:#526057;text-decoration:none}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/tailwind.css' %}?v={{ STATIC_VERSION }}">
<link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ STATIC_VERSION }}">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Raleway"','system-ui','sans-serif'],serif:['"Raleway"','Georgia','serif']},colors:{primary:{DEFAULT:'#17211d',hover:'#101713',light:'#edf1eb'},secondary:{DEFAULT:'#879b72',light:'#f2f6ef'},ink:{DEFAULT:'#17211d',muted:'#526057',subtle:'#88958a'},surface:{DEFAULT:'#FFFFFF',raised:'#fbfcf9',border:'#d8e0d5'}},maxWidth:{'8xl':'88rem'},borderRadius:{'2xl':'1rem','3xl':'1.25rem'}}}}</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Raleway','Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(135deg,#17211d 0%,#879b72 100%);min-height:100vh;display:flex;flex-direction:column}

.auth-wrap{flex:1;display:flex;justify-content:center;align-items:center;padding:84px 20px 20px}
.auth-card{position:relative;width:100%;max-width:540px;min-height:420px;background:#fff;border-radius:24px;box-shadow:0 25px 50px rgba(0,0,0,0.15);padding:2rem 2.5rem;overflow:hidden}
.auth-card::before{content:"";position:absolute;height:1200px;width:1200px;top:-50%;right:-20%;transform:translateY(-10%);background:linear-gradient(-45deg,#17211d 0%,#879b72 100%);border-radius:50%;opacity:0.08;z-index:0}
.card-title{font-size:1.8rem;color:#444;font-weight:700;text-align:center;margin-bottom:6px}
.card-sub{font-size:0.95rem;color:#666;text-align:center;margin-bottom:1.5rem}
.input-field{width:100%;background-color:#f0f0f0;margin:10px 0;height:55px;border-radius:55px;display:grid;grid-template-columns:15% 85%;padding:0 0.4rem;transition:0.3s}
.input-field:focus-within{background-color:#e8e8e8;box-shadow:0 0 0 2px #879b72}
.input-field .f-icon{display:flex;align-items:center;justify-content:center;color:#666}
.input-field input{background:none;outline:none;border:none;line-height:1;font-weight:500;font-size:1rem;color:#333;width:100%;padding-right:1rem}
.input-field input::placeholder{color:#aaa;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 36px;background:linear-gradient(90deg,#17211d 0%,#879b72 100%);border:none;border-radius:55px;color:#fff;font-size:0.9rem;font-weight:800;cursor:pointer;transition:0.3s;box-shadow:0 4px 12px rgba(23,33,29,0.3)}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--primary-glow)}
.auth-footer{text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #e5e7eb}
.auth-footer a{color:#526057;font-weight:700;text-decoration:none;font-size:0.875rem;transition:0.2s}
.auth-footer a:hover{color:#17211d}
@keyframes fadeIn{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .5s ease both}.f1{animation:fadeIn .5s ease .1s both}
@keyframes authToastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}.auth-toast{transition:opacity .35s ease}
</style>
</head>
<body>
<nav class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-xl border-b border-surface-border">
  <div class="max-w-8xl mx-auto h-16 px-6 sm:px-10 flex items-center justify-between">
    <a href="{% url 'home' %}" class="flex-shrink-0 flex items-center">
      <img src="{% static 'images/logo.svg' %}?v={{ STATIC_VERSION }}" alt="Noir" class="h-9 w-auto"/>
    </a>
    <div class="hidden md:flex items-center gap-2">
      <a href="/#platform" class="px-4 py-2 text-sm font-semibold text-ink-muted hover:text-ink hover:bg-surface-raised rounded-xl transition-all">Platform</a>
      <a href="/#features" class="px-4 py-2 text-sm font-semibold text-ink-muted hover:text-ink hover:bg-surface-raised rounded-xl transition-all">Features</a>
      
    </div>
    <div class="flex items-center gap-3">
      <a href="{% url 'accounts:login' %}" class="text-sm font-bold text-ink-muted hover:text-ink px-4 py-2 transition-colors">Log In</a>
      <a href="{% url 'accounts:register' %}" class="text-sm font-bold bg-gradient-to-r from-[#17211d] to-[#879b72] hover:from-[#101713] hover:to-[#6f845d] text-white px-6 py-2.5 rounded-xl transition-all shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30">Get started free</a>
    </div>
  </div>
</nav>
<div class="auth-wrap">
  <div class="auth-card fade-in">
    <h1 class="card-title fade-in">Reset your password</h1>
    <p class="card-sub fade-in">Enter your email and we'll send you a reset link.</p>
    <form method="POST" class="f1" style="position:relative;z-index:1">
      {% csrf_token %}
      <div class="input-field"><div class="f-icon"><svg width="20" height="20" fill="none" stroke="#666" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div><input type="email" name="email" id="id_email" autocomplete="email" placeholder="you@company.com" required /></div>
      <button type="submit" class="btn">Send reset link</button>
    </form>
    <div class="auth-footer"><a href="{% url 'accounts:login' %}">Back to login</a></div>
  </div>
</div>
{% include "auth/_auth_toasts.html" %}
</body>
</html>
