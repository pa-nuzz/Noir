<style>
  .tr-feed-card {
    position: relative;
    display: flex; flex-direction: column; gap: 8px;
    padding: 16px; border-radius: 12px;
    border: 1px solid #E2E8F0; background: #FFFFFF;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .tr-feed-card:hover { border-color: #06B6D4; box-shadow: 0 2px 12px rgba(6,182,212,0.08); }
  .tr-feed-title { font-size: 0.9375rem; font-weight: 600; color: #0A2540; line-height: 1.4; }
  .tr-feed-title a { color: inherit; text-decoration: none; }
  .tr-feed-title a:hover { color: #06B6D4; }
  .tr-feed-summary { font-size: 0.8125rem; color: #64748B; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tr-feed-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: #94A3B8; margin-top: 4px; }
  .tr-feed-topic { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 0.6875rem; font-weight: 600; }
  .tr-feed-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .tr-feed-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; border: 1px solid #E2E8F0; background: #FFFFFF; color: #64748B; cursor: pointer; transition: all 0.12s; text-decoration: none; }
  .tr-feed-btn:hover { border-color: #06B6D4; color: #06B6D4; background: #F0FDFA; }
  .tr-feed-btn svg { width: 14px; height: 14px; }
  .tr-feed-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tr-feed-score { font-size: 0.6875rem; color: #94A3B8; font-weight: 500; margin-left: auto; }
  .tr-dismiss-btn { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; border: none; background: transparent; color: #94A3B8; cursor: pointer; transition: all 0.12s; z-index: 1; }
  .tr-dismiss-btn:hover { background: #F1F5F9; color: #64748B; }
  .tr-dismiss-btn svg { width: 14px; height: 14px; }
  .tr-topic-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 2px solid #E2E8F0; background: #FFFFFF; color: #64748B; transition: all 0.12s; }
  .tr-topic-chip:hover {
    border-color: transparent;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #6D28D9, #06B6D4) border-box;
    background-clip: padding-box, border-box;
    background-origin: padding-box, border-box;
    color: #0A2540;
  }
  .tr-topic-chip.active {
    border-color: transparent;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #6D28D9, #06B6D4) border-box;
    background-clip: padding-box, border-box;
    background-origin: padding-box, border-box;
    color: #0A2540;
  }
  .tr-topic-chip.subscribed {
    border-width: 2px;
    border-color: transparent;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #6D28D9, #06B6D4) border-box;
    background-clip: padding-box, border-box;
    background-origin: padding-box, border-box;
  }
  .tr-loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #94A3B8; font-size: 0.875rem; }
  .tr-empty { text-align: center; padding: 40px 20px; color: #94A3B8; }
  .tr-empty svg { width: 40px; height: 40px; margin: 0 auto 12px; opacity: 0.4; }
  .tr-toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; font-size: 0.8125rem; font-weight: 600; color: #FFFFFF; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.25s; }
  .tr-toast.show { opacity: 1; transform: translateY(0); }
  .tr-toast.success { background: #059669; }
  .tr-toast.error { background: #DC2626; }
</style>

<div id="trending-root">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <h3 class="text-base font-bold text-slate-900">Trending Feed</h3>
      <button onclick="refreshTrendingProfile()" class="tr-feed-btn" title="Refresh your interests" style="padding:4px 8px;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
      <button onclick="refreshTrendingFeed()" class="tr-feed-btn" id="tr-refresh-btn" title="Fetch latest content now" style="padding:4px 8px;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 4h2"/></svg>
        <span id="tr-refresh-label" style="font-size:0.6875rem;">Refresh</span>
      </button>
    </div>
  </div>

  <!-- Topic filter chips -->
  <div id="tr-topic-chips" class="flex flex-wrap gap-2 mb-4"></div>

  <!-- Feed items -->
  <div id="tr-feed-list" class="space-y-3">
    <div class="tr-loading">Loading trending feed…</div>
  </div>
</div>

<div id="tr-toast" class="tr-toast"></div>

<script>
function getCSRFToken() {
  var match = document.cookie.match(new RegExp('(^| )csrftoken=([^;]+)'));
  if (match) return match[2];
  var el = document.querySelector('[data-csrf-token]');
  if (el) return el.dataset.csrfToken;
  el = document.querySelector('[name=csrfmiddlewaretoken]');
  if (el) return el.value;
  return '';
}

function showTrendingToast(msg, type, anchor) {
  var t = document.getElementById('tr-toast');
  t.textContent = msg;
  t.className = 'tr-toast ' + type + ' show';

  if (anchor) {
    var rect = anchor.getBoundingClientRect();
    t.style.position = 'fixed';
    t.style.bottom = 'auto';
    t.style.right = 'auto';
    t.style.left = Math.max(8, rect.left) + 'px';
    t.style.top = (rect.bottom + 6) + 'px';
  } else {
    t.style.position = 'fixed';
    t.style.bottom = '24px';
    t.style.right = '24px';
    t.style.left = 'auto';
    t.style.top = 'auto';
  }

  clearTimeout(t._hide);
  t._hide = setTimeout(function() { t.classList.remove('show'); }, 3000);
}

var _trCurrentTopic = null;
var _trPage = 1;
var _trTotalPages = 1;
var _trTotal = 0;

function renderItems(items) {
  var list = document.getElementById('tr-feed-list');
  if (!items || items.length === 0) {
    list.innerHTML = '<div class="tr-empty"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg><p>No trending items yet. Content collection runs every 30 minutes.</p></div>';
    return;
  }
  var html = '';
  items.forEach(function(item) {
    var topicHtml = '';
    if (item.topic) {
      topicHtml = '<span class="tr-feed-topic" style="background:' + item.topic.color + '15;color:' + item.topic.color + '">' + item.topic.icon + ' ' + item.topic.name + '</span>';
    }
    html += '<div class="tr-feed-card" data-item-id="' + item.id + '">' +
      '<button onclick="dismissItem(' + item.id + ', this)" class="tr-dismiss-btn" title="Dismiss">' +
        '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>' +
      '</button>' +
      '<div class="tr-feed-title">' +
        '<a href="' + item.url + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(item.title) + '</a>' +
      '</div>' +
      '<div class="tr-feed-summary">' + escapeHtml(item.summary) + '</div>' +
      '<div class="tr-feed-meta">' +
        topicHtml +
        '<span>' + escapeHtml(item.source) + '</span>' +
        (item.author ? '<span>' + escapeHtml(item.author) + '</span>' : '') +
        (item.published_at ? '<span>' + timeAgo(item.published_at) + '</span>' : '') +
      '</div>' +
      '<div class="tr-feed-actions">' +
        '<span class="tr-feed-score">Score: ' + item.score.toFixed(1) + '</span>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;
}

function renderPagination(page, totalPages, total) {
  var list = document.getElementById('tr-feed-list');
  if (totalPages <= 1) return;

  var startIdx = (page - 1) * 40 + 1;
  var endIdx   = Math.min(page * 40, total);

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 4px 4px;margin-top:8px;border-top:1px solid #E2E8F0;">' +
    '<span style="font-size:0.75rem;color:#94A3B8;">Showing ' + startIdx + '–' + endIdx + ' of ' + total + '</span>' +
    '<div style="display:flex;gap:6px;">';

  if (page > 1) {
    html += '<button onclick="trGoPage(' + (page - 1) + ')" class="tr-feed-btn">← Prev</button>';
  }

  var startP = Math.max(1, page - 2);
  var endP   = Math.min(totalPages, page + 2);
  if (startP > 1) {
    html += '<button onclick="trGoPage(1)" class="tr-feed-btn">1</button>';
    if (startP > 2) html += '<span style="padding:6px 4px;font-size:0.75rem;color:#94A3B8;">…</span>';
  }
  for (var p = startP; p <= endP; p++) {
    var activeStyle = p === page ? 'border-color:#06B6D4;color:#06B6D4;background:#F0FDFA;' : '';
    html += '<button onclick="trGoPage(' + p + ')" class="tr-feed-btn" style="' + activeStyle + '">' + p + '</button>';
  }
  if (endP < totalPages) {
    if (endP < totalPages - 1) html += '<span style="padding:6px 4px;font-size:0.75rem;color:#94A3B8;">…</span>';
    html += '<button onclick="trGoPage(' + totalPages + ')" class="tr-feed-btn">' + totalPages + '</button>';
  }

  if (page < totalPages) {
    html += '<button onclick="trGoPage(' + (page + 1) + ')" class="tr-feed-btn">Next →</button>';
  }

  html += '</div></div>';
  list.insertAdjacentHTML('beforeend', html);
}

function trGoPage(n) {
  loadTrendingFeed(_trCurrentTopic, n);
}

function loadTrendingFeed(topicId, page) {
  page = page || 1;
  _trCurrentTopic = topicId;
  _trPage = page;

  var list = document.getElementById('tr-feed-list');
  list.innerHTML = '<div class="tr-loading">Loading trending feed…</div>';

  var url = '{% url "trending:feed_data" %}?page=' + page;
  if (topicId === 'subscribed') {
    url += '&subscribed=1';
  } else if (topicId) {
    url += '&topic_id=' + topicId;
  }

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      _trTotalPages = data.total_pages || 1;
      _trTotal = data.total || 0;
      renderItems(data.items);
      renderPagination(data.page, data.total_pages, data.total);
      list.scrollIntoView({ behavior: 'smooth', block: 'start' });
    })
    .catch(function(err) {
      list.innerHTML = '<div class="tr-empty"><p>Failed to load feed. Please try again.</p></div>';
      console.error('Trending feed error:', err);
    });
}

function loadTrendingTopics() {
  var chips = document.getElementById('tr-topic-chips');

  return fetch('{% url "trending:topic_list" %}')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.topics || data.topics.length === 0) return null;

      var firstSubscribedId = null;
      data.topics.forEach(function(t) {
        if (t.is_subscribed && firstSubscribedId === null) {
          firstSubscribedId = t.id;
        }
      });

      var hasSubscribed = firstSubscribedId !== null;
      var html = '<button class="tr-topic-chip' + (!hasSubscribed ? ' active' : '') + '" onclick="filterTrending(this, null)">All Topics</button>';
      if (hasSubscribed) {
        html += '<button class="tr-topic-chip active" onclick="filterTrending(this, \'subscribed\')">My Topics</button>';
      }
      data.topics.forEach(function(t) {
        var cls = 'tr-topic-chip';
        if (t.is_subscribed) cls += ' subscribed';
        html += '<button class="' + cls + '" onclick="filterTrending(this, ' + t.id + ')" data-color="' + t.color + '">' +
          t.icon + ' ' + escapeHtml(t.name) +
        '</button>';
      });
      chips.innerHTML = html;
      return hasSubscribed ? 'subscribed' : null;
    })
    .catch(function(err) { console.error('Trending topics error:', err); return null; });
}

function filterTrending(btn, topicId) {
  document.querySelectorAll('.tr-topic-chip').forEach(function(c) { c.classList.remove('active'); });
  btn.classList.add('active');
  loadTrendingFeed(topicId);
}

function refreshTrendingProfile() {
  fetch('{% url "trending:refresh_profile" %}', { method: 'POST', headers: {'X-CSRFToken': getCSRFToken()} })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status === 'uptodate') {
        showTrendingToast('Already up to date', 'success');
      } else {
        showTrendingToast('Interests refreshed!', 'success');
      }
      loadTrendingTopics().then(function(topicId) {
        loadTrendingFeed(topicId);
      });
    })
    .catch(function() { showTrendingToast('Failed to refresh profile', 'error'); });
}

var _trLastRefresh = 0;
var _trRefreshTimer = null;

function refreshTrendingFeed() {
  var btn = document.getElementById('tr-refresh-btn');
  var label = document.getElementById('tr-refresh-label');
  if (btn.disabled) return;

  var now = Date.now();
  if (now - _trLastRefresh < 900000) {
    var remaining = Math.ceil((900000 - (now - _trLastRefresh)) / 60000);
    showTrendingToast('Please wait ' + remaining + ' min before refreshing again', 'error');
    return;
  }

  btn.disabled = true;
  label.textContent = 'Fetching… (90s)';

  fetch('{% url "trending:refresh_feed" %}', {
    method: 'POST',
    headers: {'X-CSRFToken': getCSRFToken()},
  })
  .then(function() {
    _trLastRefresh = now;
    showTrendingToast('Fetching fresh content…', 'success');

    var remaining = 90;
    if (_trRefreshTimer) clearInterval(_trRefreshTimer);
    _trRefreshTimer = setInterval(function() {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(_trRefreshTimer);
        _trRefreshTimer = null;
        loadTrendingFeed(_trCurrentTopic, _trPage);
        btn.disabled = false;
        label.textContent = 'Refresh';
        return;
      }
      label.textContent = 'Fetching… (' + remaining + 's)';
    }, 1000);
  })
  .catch(function() {
    showTrendingToast('Failed to trigger refresh', 'error');
    btn.disabled = false;
    label.textContent = 'Refresh';
  });
}

function dismissItem(itemId, btn) {
  fetch('{% url "trending:dismiss_item" 0 %}'.replace('0', itemId), {
    method: 'POST',
    headers: {'X-CSRFToken': getCSRFToken()},
  })
    .then(function() {
      btn.closest('.tr-feed-card').remove();
      showTrendingToast('Item dismissed', 'success', btn);
    })
    .catch(function() { showTrendingToast('Failed to dismiss', 'error', btn); });
}

function escapeHtml(text) {
  if (!text) return '';
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function timeAgo(iso) {
  var now = new Date();
  var then = new Date(iso);
  var secs = Math.floor((now - then) / 1000);
  if (secs < 60) return 'just now';
  var mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  var days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return then.toLocaleDateString();
}

function getCookie(name) {
  var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : '';
}

document.addEventListener('DOMContentLoaded', function() {
  loadTrendingTopics().then(function(topicId) {
    loadTrendingFeed(topicId);
  });
});
</script>
